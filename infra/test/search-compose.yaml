# 全部服务属于检索专用测试环境，不复用开发数据卷或凭证。
name: easy-community-search-it
services:
  mysql:
    image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    labels: { ec.search.test: "true" }
    environment:
      MYSQL_ROOT_PASSWORD: ${IT_SERVICE_PASSWORD:?必须设置测试密码}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: easy_community_search_test
    ports: ["127.0.0.1:17806:3306"]
    tmpfs: ["/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -uroot -e 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60
  redis:
    image: redis:7.4-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    labels: { ec.search.test: "true" }
    environment: { IT_SERVICE_PASSWORD: "${IT_SERVICE_PASSWORD:?必须设置测试密码}" }
    command: ["sh", "-ec", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$IT_SERVICE_PASSWORD\""]
    ports: ["127.0.0.1:17879:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$IT_SERVICE_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 2s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    labels: { ec.search.test: "true" }
    hostname: ec-search-it-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: search_test
      RABBITMQ_DEFAULT_PASS: ${IT_SERVICE_PASSWORD:?必须设置测试密码}
      RABBITMQ_DEFAULT_VHOST: easy_community_search_test
      # 与既有点赞故障测试一致，仅缩短专用Broker内部死信重试等待。
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit dead_letter_worker_publisher_confirm_timeout 1000"
    ports: ["127.0.0.1:17872:5672", "127.0.0.1:17873:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 2s
      timeout: 5s
      retries: 60
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    container_name: easy-community-search-it-es
    labels: { ec.search.test: "true" }
    mem_limit: 2g
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      xpack.security.autoconfiguration.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ELASTIC_PASSWORD: ${IT_SERVICE_PASSWORD:?必须设置测试密码}
    ports: ["127.0.0.1:19200:9200"]
    # 重启故障实验需要保留索引；该卷仅属于检索测试Compose项目。
    volumes: ["search-es-data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --user elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 3s
      timeout: 8s
      retries: 60
      start_period: 15s
volumes:
  search-es-data:
