# 连接信息仅由集成测试环境提供，Redis前缀还会追加每次运行的随机标识。
app.auth.environment=test
app.auth.redis-prefix=ec:test
app.auth.secure-cookie=false
server.forward-headers-strategy=none
spring.datasource.url=${IT_DB_URL:jdbc:mysql://127.0.0.1:3306/easy_community_auth_test?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${IT_DB_USERNAME:root}
spring.datasource.password=${IT_DB_PASSWORD}
spring.data.redis.host=${IT_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${IT_REDIS_PORT:6379}
spring.data.redis.password=${IT_REDIS_PASSWORD:}
