# 按开发环境导入本地变量，兼容从后端目录和仓库根目录启动。
spring.config.import=optional:file:.env.dev[.properties],optional:file:backend/.env.dev[.properties]

# 本地Vite代理保留/api前缀；忽略浏览器可伪造的转发头。
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=none
app.auth.environment=dev
app.auth.redis-prefix=ec:dev
app.auth.secure-cookie=false
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/easy_community?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
