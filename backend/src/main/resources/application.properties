spring.application.name=backend

# 文件存储参数由选定环境的.env提供，不提供可误用于生产的默认凭证。
app.media.provider=${MEDIA_STORAGE_PROVIDER:}
app.media.endpoint=${MEDIA_STORAGE_ENDPOINT:}
app.media.upload-endpoint=${MEDIA_STORAGE_UPLOAD_ENDPOINT:${MEDIA_STORAGE_ENDPOINT:}}
app.media.region=${MEDIA_STORAGE_REGION:}
app.media.bucket=${MEDIA_STORAGE_BUCKET:}
app.media.access-key=${MEDIA_STORAGE_ACCESS_KEY:}
app.media.secret-key=${MEDIA_STORAGE_SECRET_KEY:}
app.media.key-prefix=${MEDIA_KEY_PREFIX:}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.workflow.redis-prefix=${app.auth.redis-prefix}
app.media.workflow.policy-ttl=${MEDIA_POLICY_TTL:5m}
app.media.workflow.notification-ttl=${MEDIA_NOTIFICATION_TTL:15m}
app.media.workflow.issued-ttl=${MEDIA_ISSUED_TTL:2h}
app.media.workflow.unreferenced-ttl=${MEDIA_UNREFERENCED_TTL:24h}
app.media.workflow.delete-retry-delay=${MEDIA_DELETE_RETRY_DELAY:5m}
app.media.workflow.processing-budget=${MEDIA_PROCESSING_BUDGET:4500ms}
app.media.workflow.uploads-per-minute=${MEDIA_UPLOADS_PER_MINUTE:30}
app.media.workflow.callback-url=${MEDIA_COS_CALLBACK_URL:}
app.media.workflow.callback-key=${MEDIA_COS_CALLBACK_KEY:}
app.media.workflow.moderation-biz-type=${MEDIA_MODERATION_BIZ_TYPE:}
app.media.workflow.webhook-token=${MEDIA_WEBHOOK_TOKEN:}

# 环境必须由启动参数显式选择，不提供默认开发环境。
spring.session.timeout=15m
spring.session.data.redis.repository-type=default
# 认证类型分包后使用新命名空间；旧会话自然过期，浏览器需要重新登录。
spring.session.data.redis.namespace=${app.auth.redis-prefix}:session:v2
# 登录响应前同步保存认证快照；普通读取不重新保存认证属性。
spring.session.data.redis.flush-mode=immediate
spring.session.data.redis.save-mode=on-set-attribute
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-stacktrace=never

# 所有环境共享安全边界，仅允许覆盖限流阈值等运行参数。
app.auth.session-ttl=2h
app.auth.csrf-per-minute=${AUTH_CSRF_PER_MINUTE:60}
app.auth.login-per-minute=${AUTH_LOGIN_PER_MINUTE:30}
app.auth.user-per-minute=${AUTH_USER_PER_MINUTE:120}
app.auth.account-failures=${AUTH_ACCOUNT_FAILURES:5}
app.auth.ip-failures=${AUTH_IP_FAILURES:30}
app.auth.cleanup-delay=10m
