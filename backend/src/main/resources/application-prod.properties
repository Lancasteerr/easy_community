# 仅在生产环境导入生产变量；容器也可以直接通过环境变量注入。
spring.config.import=optional:file:.env.prod[.properties],optional:file:backend/.env.prod[.properties]

# 容器内监听，入口由Caddy和Nginx负责；不得向公网发布后端端口。
server.address=0.0.0.0
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# 必须显式限定Nginx来源，不能沿用Tomcat全部私网地址的默认信任范围。
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXY_REGEX}
server.tomcat.remoteip.trusted-proxies=(?!)
server.tomcat.redirect-context-root=false
app.auth.environment=prod
app.auth.redis-prefix=ec:prod
app.auth.secure-cookie=true
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
